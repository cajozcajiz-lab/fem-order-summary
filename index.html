<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div><img src="pattern-background" alt=""></div>
    <div class="product-card">
        <div><img src="illustration-hero.svg" alt="Product Image"></div>
        <div class="product-info">
            <h1 class="brand">Order Summary</h1>
            <p class="description">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
            <div class="plan-info"> 
                <img src="icon-music.svg" alt="Music Icon">
                <div class="plan-details">
                    <p class="plan-name">Annual Plan</p>
                    <p class="plan-price">$59.99/year</p>
                </div>
                <span class="change">Change</span>
            </div>   
                <div class="button">Proceed to Payment</div>
                <div class="cancel">Cancel Order</div>
            </div>

        </div>
</body>
</html>
